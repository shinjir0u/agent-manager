services:
  db:
    image: postgres:alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agent_manager
    ports: 
      - "5432:5432"
    networks: 
      agent_manager_network:
        aliases:
          - db
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/init-db.sql
      - db_data:/var/lib/postgresql/data 

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks: 
      agent_manager_network:
        aliases:
          - redis

  app:
    build: .	
    image: agent_manager:latest
    ports: 
      - "8000:8080"
    networks:
      agent_manager_network:
        aliases:
          - app

networks:
  agent_manager_network:    
    driver: bridge

volumes:
  db_data:                  